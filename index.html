<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Palet</title>
<meta name="description" content="Renkli notlar, yapılacaklar listeleri ve hatırlatıcılar">
<meta name="theme-color" content="#EEF0EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.4" class="f"/><circle cx="12" cy="12" r="1.4" class="f"/><circle cx="12" cy="18.5" r="1.4" class="f"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3.5h6l-1 6.5 3.5 3v2h-11v-2L10 10z"/><path d="M12 15v5.5"/></symbol>
    <symbol id="i-pin-fill" viewBox="0 0 24 24"><path class="f" d="M9 3.5h6l-1 6.5 3.5 3v2h-11v-2L10 10z"/><path d="M12 15v5.5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.2"/><path d="M5 9v10.5h14V9M10 13h4"/></symbol>
    <symbol id="i-unarchive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.2"/><path d="M5 9v10.5h14V9M12 17v-5M9.8 14l2.2-2.2 2.2 2.2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5.5M14 11v5.5"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4"/><path d="M4.5 4v4.5H9"/></symbol>
    <symbol id="i-checklist" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="4" height="4" rx="1"/><rect x="3.5" y="15.5" width="4" height="4" rx="1"/><path d="M10.5 6.5h10M10.5 17.5h10"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4.5 6h15M4.5 11h15M4.5 16h9"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-rows" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="5.5" rx="1.5"/><rect x="4" y="13.5" width="16" height="5.5" rx="1.5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-notes" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9M7 13l5-5 5 5M5 4h14"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path class="f" d="M12 4a8 8 0 0 1 0 16z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.5v11.5M8 7.5l4-4 4 4M5 12v7.5h14V12"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"/></symbol>
    <symbol id="i-install" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M12 7.5v6.5M9.5 11.5L12 14l2.5-2.5"/></symbol>
  </defs>
</svg>

<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="view-title" class="view-title">Notlar</h1>
      <button id="search-btn" class="icon-btn" type="button" aria-label="Notlarda ara" aria-expanded="false"><svg class="icon"><use href="#i-search"/></svg></button>
      <button id="menu-btn" class="icon-btn" type="button" aria-label="Görünüm ve yedek seçenekleri"><svg class="icon"><use href="#i-more"/></svg></button>
    </div>
    <div id="search-row" class="search-row" hidden>
      <label class="search-field">
        <span class="visually-hidden">Ara</span>
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="Başlıkta, metinde ya da listede ara" autocomplete="off" enterkeyhint="search">
      </label>
      <button id="search-close" class="icon-btn" type="button" aria-label="Aramayı kapat"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div id="palette" class="palette" role="group" aria-label="Renge göre filtrele"></div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <button id="fab" class="fab" type="button" aria-label="Yeni not"><svg class="icon"><use href="#i-plus"/></svg></button>

  <nav class="tabs" aria-label="Bölümler">
    <button class="tab" type="button" data-view="notes"><svg class="icon"><use href="#i-notes"/></svg><span>Notlar</span></button>
    <button class="tab" type="button" data-view="calendar"><svg class="icon"><use href="#i-calendar"/></svg><span>Takvim</span></button>
    <button class="tab" type="button" data-view="archive"><svg class="icon"><use href="#i-archive"/></svg><span>Arşiv</span></button>
    <button class="tab" type="button" data-view="trash"><svg class="icon"><use href="#i-trash"/></svg><span>Çöp kutusu</span></button>
  </nav>
</div>

<section id="editor" class="editor" hidden aria-label="Not">
  <header class="ed-bar">
    <button id="ed-back" class="icon-btn" type="button" aria-label="Notu kaydet ve kapat"><svg class="icon"><use href="#i-back"/></svg></button>
    <span class="grow"></span>
    <button id="ed-pin" class="icon-btn" type="button" aria-label="Sabitle" aria-pressed="false"><svg class="icon"><use href="#i-pin"/></svg></button>
    <button id="ed-remind" class="icon-btn" type="button" aria-label="Hatırlatıcı kur"><svg class="icon"><use href="#i-bell"/></svg></button>
    <button id="ed-archive" class="icon-btn" type="button" aria-label="Arşivle"><svg class="icon"><use href="#i-archive"/></svg></button>
    <button id="ed-more" class="icon-btn" type="button" aria-label="Diğer işlemler"><svg class="icon"><use href="#i-more"/></svg></button>
  </header>
  <div class="ed-scroll">
    <div class="ed-inner">
      <input id="ed-title" class="ed-title" type="text" placeholder="Başlık" aria-label="Başlık" autocomplete="off" enterkeyhint="next">
      <button id="ed-chip" class="chip" type="button" hidden></button>
      <textarea id="ed-body" class="ed-body" placeholder="Not" aria-label="Not metni" rows="6"></textarea>
      <div id="ed-list" class="ed-list" hidden></div>
    </div>
  </div>
  <footer class="ed-foot">
    <div id="ed-colors" class="swatches" role="radiogroup" aria-label="Not rengi"></div>
    <p id="ed-stamp" class="stamp"></p>
  </footer>
</section>

<dialog id="dlg-remind" class="dlg">
  <form method="dialog" class="dlg-form">
    <h2 class="dlg-title">Hatırlatıcı</h2>
    <div class="quick">
      <button type="button" class="pill" data-quick="tonight">Bu akşam 20:00</button>
      <button type="button" class="pill" data-quick="tomorrow">Yarın 09:00</button>
      <button type="button" class="pill" data-quick="week">Haftaya 09:00</button>
    </div>
    <label class="field-label" for="remind-at">Tarih ve saat</label>
    <input id="remind-at" class="field" type="datetime-local">
    <p id="remind-hint" class="hint"></p>
    <div class="dlg-actions">
      <button id="remind-remove" class="btn ghost danger-text" type="button">Kaldır</button>
      <span class="grow"></span>
      <button id="remind-cancel" class="btn ghost" type="button">Vazgeç</button>
      <button class="btn primary" value="save">Kaydet</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-confirm" class="dlg">
  <form method="dialog" class="dlg-form">
    <h2 id="confirm-title" class="dlg-title"></h2>
    <p id="confirm-body" class="dlg-text"></p>
    <div class="dlg-actions">
      <span class="grow"></span>
      <button class="btn ghost" value="cancel">Vazgeç</button>
      <button id="confirm-ok" class="btn danger" value="ok"></button>
    </div>
  </form>
</dialog>

<dialog id="dlg-sheet" class="dlg sheet">
  <form method="dialog" class="sheet-form">
    <h2 id="sheet-title" class="sheet-title"></h2>
    <div id="sheet-items" class="sheet-items"></div>
  </form>
</dialog>

<input id="import-file" type="file" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-msg"></span><button id="toast-act" type="button" hidden></button></div>

<script type="module" src="app.js"></script>
</body>
</html>
